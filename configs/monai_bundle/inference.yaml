# MONAI Bundle Inference Configuration for 3D Cardiac Fat Segmentation
# SlidingWindowInferer with 1.5mm isotropic resampling and 8-channel output

imports:
  - "$import glob"
  - "$import os"

bundle_root: "."
device: "$torch.device('cuda:0' if torch.cuda.is_available() else 'cpu')"
spatial_dims: 3
roi_size: [96, 96, 96]
sw_batch_size: 2
overlap: 0.5

network_def:
  _target_: monai.networks.nets.SegResNet
  spatial_dims: "@spatial_dims"
  in_channels: 1
  out_channels: 8
  init_filters: 16
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]
  dropout_prob: 0.0

inferer:
  _target_: monai.inferers.SlidingWindowInferer
  roi_size: "@roi_size"
  sw_batch_size: "@sw_batch_size"
  overlap: "@overlap"
  mode: "gaussian"

preprocessing_transforms:
  _target_: monai.transforms.Compose
  transforms:
    - _target_: monai.transforms.LoadImaged
      keys: ["image"]
    - _target_: monai.transforms.EnsureChannelFirstd
      keys: ["image"]
    - _target_: monai.transforms.Orientationd
      keys: ["image"]
      axcodes: "RAS"
    - _target_: monai.transforms.Spacingd
      keys: ["image"]
      pixdim: [1.5, 1.5, 1.5]
      mode: "bilinear"
    - _target_: monai.transforms.ScaleIntensityRanged
      keys: ["image"]
      a_min: -200.0
      a_max: 800.0
      b_min: 0.0
      b_max: 1.0
      clip: true

postprocessing_transforms:
  _target_: monai.transforms.Compose
  transforms:
    - _target_: monai.transforms.Invertd
      keys: ["pred"]
      transform: "@preprocessing_transforms"
      orig_keys: ["image"]
      nearest_interp: false
      to_meta: true
    - _target_: monai.transforms.Activationsd
      keys: ["pred"]
      sigmoid: true
    - _target_: monai.transforms.AsDiscreted
      keys: ["pred"]
      threshold: 0.5
    - _target_: monai.transforms.SaveImaged
      keys: ["pred"]
      meta_keys: ["pred_meta_dict"]
      output_dir: "@bundle_root"
      output_postfix: "eat_pvat.seg"
      output_ext: ".nrrd"
      separate_folder: false

