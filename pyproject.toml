[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monai-cardiac-fat-fl"
version = "0.1.0"
description = "Modernized MONAI & NVIDIA FLARE pipeline for Epicardial and Pericoronary Adipose Tissue (EAT/PVAT) quantification from cardiac CT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Tyler Patay" },
    { name = "XuCong Ruan" },
    { name = "Shawn Newlander" },
    { name = "George Wesbey" },
    { name = "Borek Foldyna" }
]
keywords = [
    "cardiac-ct",
    "epicardial-fat",
    "pericoronary-fat",
    "monai",
    "federated-learning",
    "nvflare",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "monai[itk,nibabel]>=1.4.0",
    "nvflare>=2.5.0",
    "pynrrd>=1.0.0",
    "simpleitk>=2.2.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "onnxruntime>=1.16.0",
    "pydicom>=2.4.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
cardiac-fat-fl = "cardiac_fat_fl.cli:app"

[project.urls]
Homepage = "https://github.com/tylerp61391/monai-cardiac-fat-fl"
Repository = "https://github.com/tylerp61391/monai-cardiac-fat-fl.git"
Documentation = "https://github.com/tylerp61391/monai-cardiac-fat-fl#readme"
"Bug Tracker" = "https://github.com/tylerp61391/monai-cardiac-fat-fl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

